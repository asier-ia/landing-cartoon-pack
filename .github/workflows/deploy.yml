name: Deploy to GitHub Pages

on:
  push:
    branches: [galletas]

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install
        working-directory: frontend

      - name: Build
        run: |
          set +e
          echo "=== pwd ==="
          pwd
          echo "=== ls frontend ==="
          ls -la frontend/
          echo "=== node -v ==="
          node -v
          echo "=== npm -v ==="
          npm -v
          echo "=== which vite ==="
          which vite
          echo "=== ls node_modules/.bin/vite* ==="
          ls -la frontend/node_modules/.bin/vite*
          echo "=== npm run build ==="
          cd frontend
          npm run build 2>&1; EXIT=$?
          echo "=== EXIT CODE: $EXIT ==="
          echo "=== dist contents ==="
          ls -la dist/ 2>&1
          exit $EXIT

      - uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: frontend/dist
          destination_dir: ${{ github.ref_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}