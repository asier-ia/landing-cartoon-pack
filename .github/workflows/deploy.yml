name: Deploy to GitHub Pages

on:
  push:
    branches: [galletas]

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          set +e
          echo "# Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "=== pwd ==="
          pwd
          pwd >> $GITHUB_STEP_SUMMARY

          echo "=== node -v ==="
          node -v
          node -v >> $GITHUB_STEP_SUMMARY

          echo "=== npm -v ==="
          npm -v
          npm -v >> $GITHUB_STEP_SUMMARY

          echo "=== directory ==="
          ls -la
          ls -la >> $GITHUB_STEP_SUMMARY

          echo "=== cd frontend ==="
          cd frontend
          pwd
          pwd >> $GITHUB_STEP_SUMMARY

          echo "=== ls node_modules/.bin/vite* ==="
          ls node_modules/.bin/vite*
          ls node_modules/.bin/vite* >> $GITHUB_STEP_SUMMARY 2>&1

          echo "=== npm install ==="
          npm install
          npm install >> $GITHUB_STEP_SUMMARY 2>&1

          echo "=== running: vite build ==="
          ./node_modules/.bin/vite build --base /landing-cartoon-pack/galletas/ 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          echo "EXIT CODE: $EXIT"
          cat /tmp/build.log >> $GITHUB_STEP_SUMMARY 2>&1
          echo "EXIT CODE: $EXIT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la dist/ >> $GITHUB_STEP_SUMMARY 2>&1
          exit $EXIT

      - uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: frontend/dist
          destination_dir: ${{ github.ref_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}